<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — PDFSee</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-707c3204.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    body { background: #F7F7F4; color: #171716; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { text-align: center; max-width: 480px; }
    .code { font-size: 120px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: #b52a20; }
    .title { font-size: 24px; font-weight: 600; margin: 16px 0 8px; }
    .desc { font-size: 16px; color: #6C6C68; margin-bottom: 24px; }
    .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a { color: #98251e; text-decoration: none; font-size: 14px; font-weight: 500; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #b52a20; outline-offset: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1 class="title">页面未找到 / Page Not Found</h1>
    <p class="desc">你访问的页面不存在，请检查链接是否正确。<br>The page you are looking for does not exist.</p>
    <div class="links">
      <a href="/">中文首页</a>
      <a href="/en/">English Home</a>
    </div>
  </div>
</body>
</html>
