name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      arch:
        description: DMG 架构
        required: true
        default: universal
        type: choice
        options:
          - universal
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: macOS installer
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      dmg_name: ${{ steps.version.outputs.dmg_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release version
        id: version
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo '发布标签必须与 package.json 的版本一致。' >&2
            exit 1
          fi
          ARCH=${INPUT_ARCH:-universal}
          case "$ARCH" in
            universal|arm64|x64) ;;
            *) exit 2 ;;
          esac
          DMG_NAME="PDFSee-macos-$VERSION.dmg"
          if [[ "$ARCH" != universal ]]; then
            DMG_NAME="PDFSee-macos-$VERSION-$ARCH.dmg"
          fi
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/pdfsee-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pdfsee-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Build, sign and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PDFSEE_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_ARCH: ${{ steps.version.outputs.arch }}
        run: npm run package:mac -- "--$RELEASE_ARCH"

      - name: Verify notarized installer
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          set -euo pipefail
          DMG_PATH="release/$DMG_NAME"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          cd release
          shasum -a 256 "$DMG_NAME" > SHA256SUMS-macos.txt

      - name: Upload verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          if-no-files-found: error
          path: |
            release/${{ steps.version.outputs.dmg_name }}
            release/SHA256SUMS-macos.txt

      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/pdfsee-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/pdfsee-developer-id.p12"

  windows:
    name: Windows installer (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      exe_name: ${{ steps.version.outputs.exe_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo '发布标签必须与 package.json 的版本一致。' >&2
            exit 1
          fi
          echo "exe_name=PDFSee-windows-$VERSION.exe" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win

      - name: Check installer and generate checksum
        env:
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
        run: |
          set -euo pipefail
          cd release
          test -s "$EXE_NAME"
          sha256sum "$EXE_NAME" > SHA256SUMS-windows.txt
          sha256sum --check SHA256SUMS-windows.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            release/${{ steps.version.outputs.exe_name }}
            release/SHA256SUMS-windows.txt

  publish:
    name: Publish GitHub Release
    needs: [release, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v5
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: release

      - name: Verify and publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG_NAME: ${{ needs.release.outputs.dmg_name }}
          EXE_NAME: ${{ needs.windows.outputs.exe_name }}
        run: |
          set -euo pipefail
          cd release
          test -s "$DMG_NAME"
          test -s "$EXE_NAME"
          cat SHA256SUMS-macos.txt SHA256SUMS-windows.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "PDFSee $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$DMG_NAME" "$EXE_NAME" SHA256SUMS.txt --clobber

      - name: Check out website branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: website-source

      - name: Update website download links
        working-directory: website-source
        env:
          WEBSITE_BRANCH: ${{ github.event.repository.default_branch }}
          DMG_NAME: ${{ needs.release.outputs.dmg_name }}
          EXE_NAME: ${{ needs.windows.outputs.exe_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$WEBSITE_BRANCH"
            git checkout --detach FETCH_HEAD
            node scripts/update-website-downloads.cjs "$GITHUB_REF_NAME" "$DMG_NAME" "$EXE_NAME"
            if git diff --quiet -- website/index.html website/en/index.html; then
              exit 0
            fi
            git add -- website/index.html website/en/index.html
            git commit -m "更新官网下载链接 $GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$WEBSITE_BRANCH"; then
              exit 0
            fi
          done
          exit 1
