name: Build signed and notarized DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      arch:
        description: DMG 架构
        required: true
        default: universal
        type: choice
        options:
          - universal
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release version
        id: version
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo '发布标签必须与 package.json 的版本一致。' >&2
            exit 1
          fi
          ARCH=${INPUT_ARCH:-universal}
          case "$ARCH" in
            universal|arm64|x64) ;;
            *) exit 2 ;;
          esac
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=PDFSee-$VERSION-$ARCH.dmg" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/pdfsee-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pdfsee-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Build, sign and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PDFSEE_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_ARCH: ${{ steps.version.outputs.arch }}
        run: npm run package:mac -- "--$RELEASE_ARCH"

      - name: Verify notarized installer
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          set -euo pipefail
          DMG_PATH="release/$DMG_NAME"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          cp "$DMG_PATH" release/PDFSee.dmg
          cmp "$DMG_PATH" release/PDFSee.dmg
          cd release
          shasum -a 256 "$DMG_NAME" PDFSee.dmg > SHA256SUMS.txt

      - name: Upload verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dmg_name }}
          if-no-files-found: error
          path: |
            release/${{ steps.version.outputs.dmg_name }}
            release/PDFSee.dmg
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "PDFSee $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "release/$DMG_NAME" release/PDFSee.dmg release/SHA256SUMS.txt --clobber

      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/pdfsee-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/pdfsee-developer-id.p12"
